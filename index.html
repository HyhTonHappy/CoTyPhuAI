<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cờ Tỷ Phú AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: square toy board on a wooden table, the bank & players ledger docked at the right; one screen, built for a classroom TV. */
:root{
  --wood:#c98d58; --wood-dk:#a8693a; --frame:#302b3f; --cream:#fff8ea; --paper:#fffdf6;
  --ink:#2b2340; --ink-soft:#5e5574; --gold:#ffb300; --gold-dk:#d98a00;
  --good:#1f9d55; --bad:#e0383e; --sky:#3fa9f5;
  --display:"Baloo 2","Nunito","Segoe UI",Roboto,Arial,sans-serif;
  --body:"Nunito","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-family:var(--body);color:var(--ink);
  background:
   repeating-linear-gradient(92deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px),
   repeating-linear-gradient(88deg,rgba(90,40,10,.07) 0 1px,transparent 1px 23px),
   linear-gradient(180deg,var(--wood),var(--wood-dk));
  overflow:hidden}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

.app{height:100%;box-sizing:border-box;display:flex;gap:16px;align-items:center;justify-content:center;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.board{position:relative;--B:min(calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)), calc(100vw - 420px));
  --fs:max(9px,calc(var(--B)*.0158));
  flex:none;width:var(--B);height:var(--B);box-sizing:border-box;display:grid;
  grid-template-columns:1.32fr repeat(7,1fr) 1.32fr;grid-template-rows:1.32fr repeat(7,1fr) 1.32fr;
  gap:calc(var(--B)*.004);padding:calc(var(--B)*.012);background:var(--frame);border-radius:calc(var(--B)*.025);
  box-shadow:0 18px 40px rgba(60,25,5,.45),inset 0 0 0 3px rgba(255,255,255,.06)}

/* tiles */
.tile{position:relative;background:var(--cream);border-radius:calc(var(--B)*.008);overflow:hidden;display:flex;
  align-items:center;justify-content:center;gap:2%;cursor:pointer;box-sizing:border-box;transition:transform .15s}
.tile:hover{transform:scale(1.04);z-index:3}
.tile .strip{position:absolute;background:var(--gc,transparent)}
.tile.top{flex-direction:column;padding:6% 4% 18%}
.tile.top .strip{left:0;right:0;bottom:0;height:13%}
.tile.bottom{flex-direction:column;padding:18% 4% 6%}
.tile.bottom .strip{left:0;right:0;top:0;height:13%}
.tile.left{flex-direction:row;padding:4% 15% 4% 5%}
.tile.left .strip{top:0;bottom:0;right:0;width:11%}
.tile.right{flex-direction:row;padding:4% 5% 4% 15%}
.tile.right .strip{top:0;bottom:0;left:0;width:11%}
.tile .ic{object-fit:contain;flex:none}
.tile.top .ic,.tile.bottom .ic{width:82%;height:40%}
.tile.left .ic,.tile.right .ic{width:38%;height:78%}
.tile .tx{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;gap:2px}
.tile .nm{font-family:var(--display);font-weight:800;font-size:var(--fs);line-height:1.02;color:var(--ink);text-wrap:balance}
.tile .pr{font-weight:800;font-size:calc(var(--fs)*.86);color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.tile.owned{box-shadow:inset 0 0 0 calc(var(--B)*.0045) var(--oc)}
.tile.owned .pr{background:var(--oc);color:#fff;border-radius:99px;padding:0 .5em}
.tile .hb{position:absolute;top:2%;right:3%;display:flex;align-items:center;gap:1px;background:#fff;border-radius:6px;padding:1px 3px 1px 1px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tile .hb img{height:calc(var(--B)*.03);width:auto;border-radius:4px}
.tile .hb b{font-size:calc(var(--fs)*.8);color:var(--gold-dk)}
.tile.chance{background:#ffe9f2}.tile.fate{background:#fff3c8}
.tile.chance .ic,.tile.fate .ic{border-radius:8%}
.tile.chance .nm{color:#c2185b}.tile.fate .nm{color:#c76a00}
.tile.corner{padding:4%;background:#dff1ff}
.tile.corner .ic{width:100%;height:100%;object-fit:cover;border-radius:calc(var(--B)*.008)}
.toks{position:absolute;left:0;right:0;bottom:1%;display:flex;justify-content:center;pointer-events:none;z-index:4}
.toks img{height:calc(var(--B)*.06);width:auto;margin:0 calc(var(--B)*-.006);filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.toks img.me{height:calc(var(--B)*.072);animation:hop .7s ease-in-out infinite alternate;z-index:2}
@keyframes hop{to{transform:translateY(-12%)}}
.tile.flash{animation:flash .6s ease 2}
@keyframes flash{50%{background:#fff2a8}}

/* centre */
.center{grid-area:2/2/9/9;position:relative;border-radius:calc(var(--B)*.012);overflow:hidden;
  background:#9fd5ff center/cover no-repeat;display:grid;place-items:center}
.center::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.15) 30%,rgba(255,255,255,.55))}
.hud{position:relative;width:74%;background:rgba(255,253,246,.95);border-radius:calc(var(--B)*.022);
  box-shadow:0 10px 30px rgba(30,20,60,.3),0 0 0 calc(var(--B)*.004) #fff inset;padding:calc(var(--B)*.022);
  display:flex;flex-direction:column;gap:calc(var(--B)*.014);font-size:calc(var(--fs)*1.15)}
.turn{display:flex;align-items:center;gap:calc(var(--B)*.014)}
.turn img{height:calc(var(--B)*.11);width:auto;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.turn .lbl{font-size:.8em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.turn .pname{font-family:var(--display);font-weight:800;font-size:1.7em;line-height:1}
.turn .cash{margin-left:auto;text-align:right;font-family:var(--display);font-weight:800;font-size:1.45em;color:var(--good);font-variant-numeric:tabular-nums;line-height:1}
.turn .cash small{display:block;font-family:var(--body);font-size:.5em;color:var(--ink-soft);letter-spacing:.05em;text-transform:uppercase}
.dicebox{display:flex;justify-content:center;align-items:center;gap:calc(var(--B)*.02)}
.dicebox{perspective:calc(var(--B)*.9);position:relative}
.dwrap{--ds:calc(var(--B)*.088);width:var(--ds);height:var(--ds);position:relative}
.dwrap::after{content:"";position:absolute;left:8%;right:8%;bottom:-16%;height:14%;border-radius:50%;background:rgba(40,25,60,.28);filter:blur(3px);z-index:-1}
.dwrap.toss{animation:toss 1.15s cubic-bezier(.3,.6,.4,1)}
@keyframes toss{0%{transform:translateY(0)}28%{transform:translateY(-95%) scale(1.12)}58%{transform:translateY(0)}72%{transform:translateY(-22%)}86%{transform:translateY(0)}93%{transform:translateY(-5%)}100%{transform:none}}
.cube{position:absolute;inset:0;transform-style:preserve-3d}
.cube img{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cube .core{position:absolute;inset:6%;background:#f4ece0}
.f1{transform:translateZ(calc(var(--ds)/2))}
.f6{transform:rotateY(180deg) translateZ(calc(var(--ds)/2))}
.f3{transform:rotateY(90deg) translateZ(calc(var(--ds)/2))}
.f4{transform:rotateY(-90deg) translateZ(calc(var(--ds)/2))}
.f2{transform:rotateX(90deg) translateZ(calc(var(--ds)/2))}
.f5{transform:rotateX(-90deg) translateZ(calc(var(--ds)/2))}
.dsum.pop{animation:spop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes spop{from{transform:scale(.3);opacity:0}}
.dbl{position:absolute;left:50%;top:-30%;transform:translateX(-50%);background:var(--bad);color:#fff;font-family:var(--display);font-weight:800;
  padding:.1em .7em;border-radius:99px;font-size:1.1em;animation:dbl 1.6s ease forwards;pointer-events:none;white-space:nowrap;z-index:3}
@keyframes dbl{0%{transform:translate(-50%,40%) scale(.3);opacity:0}20%{transform:translate(-50%,0) scale(1.25);opacity:1}35%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
.olddie{width:calc(var(--B)*.085);height:calc(var(--B)*.085);background:#fff;border-radius:18%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);
  padding:12%;box-sizing:border-box;box-shadow:0 4px 0 #cfc6b4,0 6px 12px rgba(0,0,0,.25)}
.die i{width:68%;height:68%;margin:auto;border-radius:50%;background:transparent}
.die i.on{background:#222}
.die.roll{animation:shake .12s linear infinite}
@keyframes shake{25%{transform:rotate(12deg)}75%{transform:rotate(-12deg)}}
.dsum{font-family:var(--display);font-weight:800;font-size:1.6em;min-width:2.2em;text-align:center}
.acts{display:flex;flex-wrap:wrap;gap:calc(var(--B)*.01);justify-content:center}
.note{text-align:center;font-weight:800;color:var(--ink-soft);font-size:.95em}
.btn{border:0;border-radius:999px;padding:.55em 1.2em;font-weight:900;font-size:1em;background:#eee6d6;color:var(--ink);
  box-shadow:0 4px 0 #cbbfa6;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #cbbfa6}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.main{background:var(--gold);box-shadow:0 4px 0 var(--gold-dk);font-size:1.15em;padding:.6em 1.6em}
.btn.go{background:#35b86a;color:#fff;box-shadow:0 4px 0 #1f8048}
.btn.red{background:var(--bad);color:#fff;box-shadow:0 4px 0 #a5242a}
.btn.blue{background:var(--sky);color:#fff;box-shadow:0 4px 0 #1f7ac0}
.log{margin:0;padding:0;list-style:none;font-size:.82em;color:var(--ink-soft);display:flex;flex-direction:column;gap:2px;border-top:2px dashed #e6dcc7;padding-top:calc(var(--B)*.01)}
.log li:first-child{color:var(--ink);font-weight:800}
.toast{position:absolute;top:5%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;
  padding:.5em 1.1em;border-radius:99px;font-size:calc(var(--fs)*1.3);white-space:nowrap;z-index:5;animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,-30%)}}

/* side ledger */
.side{flex:1;min-width:0;max-width:440px;height:100%;display:flex;flex-direction:column;gap:12px;overflow:auto}
.brand{background:var(--frame);color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:1.65rem;line-height:1;color:var(--gold)}
.brand p{margin:2px 0 0;font-size:.85rem;opacity:.85;font-weight:700}
.tools{margin-left:auto;display:flex;gap:6px}
.ib{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;width:38px;height:38px;font-size:1.05rem;font-weight:900}
.ib:hover{background:rgba(255,255,255,.26)}
.ib.wide{width:auto;padding:0 12px;background:var(--gold);color:var(--ink);font-size:.95rem;white-space:nowrap}
.ib.wide:hover{background:#ffc93a}
.brand{flex-wrap:wrap}
.players{display:flex;flex-direction:column;gap:8px}
.pc{background:var(--paper);border-radius:14px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;
  border-left:8px solid var(--pc);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.pc.cur{outline:4px solid var(--gold);box-shadow:0 0 0 7px rgba(255,179,0,.25)}
.pc.out{opacity:.45;filter:grayscale(1)}
.pc img.tk{grid-row:1/3;height:56px;width:auto}
.pc .n{font-family:var(--display);font-weight:800;font-size:1.2rem;line-height:1.05;min-width:0;overflow-wrap:anywhere}
.pc .m{font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--good);font-variant-numeric:tabular-nums;text-align:right}
.pc .m.neg{color:var(--bad)}
.pc .props{grid-column:2/4;display:flex;flex-wrap:wrap;gap:3px;min-height:12px}
.pc .props span{width:14px;height:14px;border-radius:4px;background:var(--gc);position:relative}
.pc .props span.l{outline:2px solid var(--ink);outline-offset:-2px}
.pc .bd{display:flex;gap:4px;flex-wrap:wrap;grid-column:2/4}
.chip{font-size:.75rem;font-weight:900;border-radius:99px;padding:1px 8px;background:#eee;color:var(--ink)}
.chip.j{background:var(--frame);color:#fff}.chip.f{background:#d6f5e1;color:#126b38}
.panel{background:var(--paper);border-radius:14px;padding:10px 12px}
.panel h2{margin:0 0 6px;font-family:var(--display);font-size:1.05rem;font-weight:800;letter-spacing:.02em}
.hprice{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.hprice div{text-align:center;font-size:.78rem;font-weight:800;line-height:1.1}
.hprice img{width:100%;height:auto;border-radius:8px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(30,20,50,.55);display:grid;place-items:center;z-index:50;padding:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.md{background:var(--paper);border-radius:22px;width:min(760px,100%);max-height:calc(100dvh - 32px);overflow:auto;box-sizing:border-box;
  padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:pop .22s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.md h3{margin:0 0 8px;font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1.1;text-wrap:balance}
.md p{font-size:1.15rem;line-height:1.45;margin:.4em 0}
.mbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.mbtns .btn{font-size:1.15rem}
.qhead{display:flex;gap:16px;align-items:center}
.qhead img{width:110px;height:auto;border-radius:12px;flex:none}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.qtext{font-family:var(--display);font-weight:700;font-size:1.65rem;line-height:1.25;margin:12px 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:3px solid #e4dac4;background:#fff;border-radius:16px;padding:12px 14px;font-size:1.25rem;font-weight:700;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--gold);background:#fff8e1}
.opt b{flex:none;width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--frame);color:#fff;font-family:var(--display)}
.opt.ok{border-color:var(--good);background:#e2f7ea}.opt.ok b{background:var(--good)}
.opt.no{border-color:var(--bad);background:#fde6e6}.opt.no b{background:var(--bad)}
.opt:disabled{cursor:default}
.timer{height:10px;background:#eee4d0;border-radius:99px;overflow:hidden;margin-top:8px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--gold),var(--bad));transform-origin:left}
.verdict{font-family:var(--display);font-weight:800;font-size:1.5rem;text-align:center;margin-top:12px}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.flip{perspective:1000px;width:min(330px,80%);margin:0 auto;aspect-ratio:9/10}
.flip .in{position:relative;width:100%;height:100%;transition:transform .8s;transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip .fa{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;overflow:hidden}
.flip .fa img{width:100%;height:100%;object-fit:cover}
.flip .bk{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;box-sizing:border-box;text-align:center;
  font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.25;border:8px solid var(--cc);background:var(--cbg);color:var(--ink)}
.flip .bk small{font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;color:var(--cc);margin-bottom:10px}
.tinfo{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
.tinfo img{width:100%;border-radius:14px;background:var(--cream)}
.rt{width:100%;border-collapse:collapse;font-size:1.05rem}
.rt td{padding:4px 6px;border-bottom:1px solid #eee3cc}
.rt td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.rt tr.now td{background:#fff3c4}
.mg{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:8px 10px;border:2px solid #efe6d2}
.mrow .dot{width:14px;height:40px;border-radius:5px;background:var(--gc)}
.mrow .t{font-weight:800;font-size:1.05rem;min-width:0}
.mrow .t small{display:block;color:var(--ink-soft);font-weight:700;font-size:.85rem}
.mrow .b{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mrow .btn{font-size:.85rem;padding:.4em .8em}

/* setup */
.setup{position:fixed;inset:0;z-index:40;overflow:auto;background:#3b2c55 center/cover no-repeat;display:grid;place-items:center;padding:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.setup::before{content:"";position:fixed;inset:0;background:rgba(30,20,50,.45)}
.sbox{position:relative;background:var(--paper);border-radius:26px;width:min(980px,100%);padding:24px;box-sizing:border-box;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.sbox h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2rem,5vw,3.2rem);line-height:1;color:var(--frame)}
.sbox h2 span{color:var(--gold-dk)}
.sub{font-weight:800;color:var(--ink-soft);margin:.3em 0 1em;font-size:1.05rem}
.picks{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.pk{border:3px solid #e9dfca;border-radius:18px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;opacity:.5;transition:.15s}
.pk.on{opacity:1;border-color:var(--pc);box-shadow:0 0 0 4px color-mix(in srgb,var(--pc) 25%,transparent)}
.pk button{border:0;background:none;padding:0}
.pk img{height:110px;width:auto}
.pk input{width:100%;box-sizing:border-box;border:2px solid #e6dcc7;border-radius:10px;padding:6px;font:inherit;font-weight:800;text-align:center;font-size:1rem}
.opts2{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
.opts2 label{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:.9rem;color:var(--ink-soft)}
.opts2 select{font:inherit;font-weight:800;padding:8px;border-radius:10px;border:2px solid #e6dcc7;background:#fff;color:var(--ink)}
.opts2 .ck{flex-direction:row;align-items:center;gap:8px;background:#fff;border:2px solid #e6dcc7;border-radius:10px;padding:8px;color:var(--ink)}
.opts2 .ck input{width:20px;height:20px}
.sact{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.sact .btn{font-size:1.2rem}
.rank{display:flex;flex-direction:column;gap:8px}
.rk{display:grid;grid-template-columns:40px 60px 1fr auto;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px 12px;border:2px solid #eee3cc}
.rk:first-child{border-color:var(--gold);background:#fff6d6}
.rk .no{font-family:var(--display);font-weight:800;font-size:1.8rem;text-align:center}
.rk img{height:58px;width:auto}
.rk .nn{font-family:var(--display);font-weight:800;font-size:1.3rem}
.rk .nn small{display:block;font-family:var(--body);font-size:.8rem;color:var(--ink-soft)}
.rk .w{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--good);font-variant-numeric:tabular-nums}
.rules li{margin:.35em 0;font-size:1.08rem;line-height:1.4}

@media (max-width:1000px){
  html,body{height:auto;overflow:auto}
  .app{flex-direction:column;height:auto}
  .board{--B:calc(100vw - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px))}
  .side{max-width:none;width:100%;height:auto;overflow:visible}
  .hud{width:86%}
  .picks{grid-template-columns:repeat(3,1fr)}
  .opts2{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){
  .log{display:none}
  .tinfo{grid-template-columns:1fr}
  .tinfo img{max-width:160px}
  .qtext{font-size:1.3rem}.opt{font-size:1.05rem}
  .qhead img{width:72px}
}
/* motion layer */
.flyer{position:absolute;z-index:20;height:calc(var(--B)*.08);width:auto;pointer-events:none;transform:translate(-50%,-100%);filter:drop-shadow(0 6px 5px rgba(0,0,0,.35))}

.tile.stamp{animation:stamp .7s cubic-bezier(.3,1.5,.5,1);z-index:6}

.spark{font-size:22px;text-shadow:0 0 6px #fff}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.pc .m.up{animation:mup .7s ease}.pc .m.down{animation:mdown .7s ease}
@keyframes mup{30%{transform:scale(1.3);color:var(--good);text-shadow:0 0 12px rgba(31,157,85,.5)}}
@keyframes mdown{30%{transform:scale(1.3);color:var(--bad);text-shadow:0 0 12px rgba(224,56,62,.5)}}
.pc.cur{animation:curglow 1.6s ease-in-out infinite}
@keyframes curglow{50%{box-shadow:0 0 0 12px rgba(255,179,0,.12)}}
.hud.enter{animation:hudin .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes hudin{from{transform:scale(.85) translateY(8%);opacity:0}}
.md.shake{animation:mshake .45s ease}
@keyframes mshake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.jailfx{position:absolute;inset:0;z-index:15;pointer-events:none;display:grid;place-items:center;overflow:hidden}
.jailfx .bars{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 7%,#3a3550 7% 9.5%,#6c6685 9.5% 10%,transparent 10% 14%);
  animation:bars 1.6s cubic-bezier(.5,0,.3,1.3) forwards}
@keyframes bars{0%{transform:translateY(-105%)}25%{transform:translateY(0)}80%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
.jailfx b{position:relative;font-family:var(--display);font-weight:800;font-size:calc(var(--B)*.07);color:#fff;background:var(--bad);padding:0 .5em;border-radius:20px;
  box-shadow:0 8px 0 #a5242a;animation:jt 1.6s ease forwards}
@keyframes jt{0%,20%{transform:scale(0) rotate(-12deg)}35%{transform:scale(1.2) rotate(-4deg)}45%{transform:scale(1) rotate(-4deg)}85%{opacity:1}100%{opacity:0}}
.pk.on img{animation:bob 1.4s ease-in-out infinite alternate}
.pk:nth-child(2n) img{animation-delay:-.7s}
@keyframes bob{to{transform:translateY(-8px) rotate(2deg)}}
.sbox h2{animation:hudin .7s cubic-bezier(.3,1.4,.5,1)}
.flip .fa.bk::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-120%)}
.flip.open .fa.bk::after{animation:shine 1s .8s ease}
@keyframes shine{to{transform:translateX(120%)}}
.buyout{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0}
.buyout img{height:90px;width:auto}
.buyout .arr{font-size:2.4rem;color:var(--gold-dk);animation:arr 1s ease-in-out infinite alternate}
@keyframes arr{to{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(n){const neg=n<0;n=Math.abs(n);let s=n>=1000?(n/1000).toLocaleString('vi-VN',{maximumFractionDigits:3})+' tỷ':n.toLocaleString('vi-VN')+' triệu';return (neg?'−':'')+s}
const LETTERS='ABCD';
const SAVE_KEY='cotyphu-ai-tuan12';

let S=null;            // game state
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const DROT={1:[0,0],2:[-90,0],3:[0,-90],4:[0,90],5:[90,0],6:[0,180]};
const SP=[[0,0],[0,0]];   // full spins per die so each roll keeps tumbling forward
let MOVING=null,lastCur=-1,lastMoney={},lastBuilt=null;
let busy=false;
let soundOn=true;

/* ---------- sound ---------- */
let AC=null;
function tone(f,d=.12,type='sine',v=.15,delay=0){if(!soundOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);
  g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={
 dice(){for(let i=0;i<6;i++)tone(300+Math.random()*500,.05,'square',.05,i*.07)},
 step(){tone(660,.05,'triangle',.06)},
 coin(){tone(988,.08,'square',.07);tone(1319,.18,'square',.07,.08)},
 pay(){tone(440,.1,'triangle',.1);tone(330,.15,'triangle',.1,.1)},
 good(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.12,i*.09))},
 bad(){[392,311,233].forEach((f,i)=>tone(f,.22,'sawtooth',.07,i*.14))},
 build(){[392,523,659].forEach((f,i)=>tone(f,.1,'square',.06,i*.06))}
};

/* ---------- state ---------- */
function newGame(players,settings){
  S={players:players.map((p,i)=>({id:p.id,name:p.name,money:settings.start,pos:0,inJail:false,jt:0,free:0,out:false})),
    own:{},cur:0,phase:'roll',dc:0,dice:[1,1],log:[],qOrder:shuffle([...Q.keys()]),qPtr:0,
    deck:{ch:shuffle([...DECK.ch.keys()]),vk:shuffle([...DECK.vk.keys()])},dp:{ch:0,vk:0},
    set:settings,turn:1,stats:{right:0,wrong:0},after:'end',over:false};
  log(`Ván mới bắt đầu. Mỗi nhóm có ${fmt(settings.start)}.`);
}
function save(){try{if(S)localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function loadSaved(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');return s&&s.players&&!s.over?s:null}catch(e){return null}}
const P=()=>S.players[S.cur];
function log(m){S.log.unshift(m);S.log.length=Math.min(S.log.length,40)}
const props=p=>Object.keys(S.own).map(Number).filter(i=>S.own[i].p===p.id);
const groupTiles=g=>TILES.map((t,i)=>t.g===g?i:-1).filter(i=>i>=0);
const fullSet=(pid,g)=>groupTiles(g).every(i=>S.own[i]&&S.own[i].p===pid);
const byId=id=>S.players.find(p=>p.id===id);
function rentOf(i){const o=S.own[i],t=TILES[i],b=t.price/10;if(!o)return b;if(o.lv===0)return fullSet(o.p,t.g)?b*2:b;return b*MULT[o.lv]}
function worth(p){return p.money+props(p).reduce((s,i)=>{let v=TILES[i].price;for(let k=1;k<=S.own[i].lv;k++)v+=HOUSE[k];return s+v},0)}
const levels=p=>props(p).reduce((s,i)=>s+S.own[i].lv,0);
const alive=()=>S.players.filter(p=>!p.out);

/* ---------- board render ---------- */
function cell(i){if(i<=8)return[1,i+1];if(i<=16)return[i-7,9];if(i<=24)return[9,25-i];return[33-i,1]}
function side(i){if(i%8===0)return'corner';if(i<8)return'top';if(i<16)return'right';if(i<24)return'bottom';return'left'}
function buildBoard(){
  const b=$('#board');
  TILES.forEach((t,i)=>{
    const d=document.createElement('div');const sd=side(i);const[r,c]=cell(i);
    d.className='tile '+sd+(t.t==='ch'?' chance':t.t==='vk'?' fate':'');d.id='t'+i;d.style.gridArea=`${r}/${c}`;
    d.tabIndex=0;d.setAttribute('role','button');d.setAttribute('aria-label',t.n);
    if(sd==='corner'){d.innerHTML=`<img class="ic" src="${IMG[t.img]}" alt="${esc(t.n)}"><div class="toks"></div>`}
    else{
      const img=t.t==='ch'?'card1':t.t==='vk'?'card0':t.img;
      if(t.g)d.style.setProperty('--gc',GC[t.g]);
      d.innerHTML=`<div class="strip"></div><img class="ic" src="${IMG[img]}" alt=""><div class="tx"><div class="nm">${esc(t.n)}</div>${t.price?`<div class="pr">${t.price}</div>`:''}</div><div class="toks"></div>`;
    }
    d.onclick=()=>{if(!busy)tileInfo(i)};d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tileInfo(i)}};
    b.appendChild(d);
  });
  $('#center').style.backgroundImage=`url(${IMG.center})`;
  $('#hprice').innerHTML=[1,2,3,4,5].map(l=>`<div><img src="${IMG['h'+l]}" alt="Nhà cấp ${l} giá ${HOUSE[l]} triệu"></div>`).join('');
}
function renderTiles(){
  TILES.forEach((t,i)=>{
    const d=$('#t'+i);if(!t.price)return;const o=S.own[i];
    d.classList.toggle('owned',!!o);
    const pr=d.querySelector('.pr');
    d.querySelector('.hb')?.remove();
    if(o){const ow=byId(o.p);d.style.setProperty('--oc',PCOL[o.p]);pr.textContent='Thuê '+rentOf(i);
      if(o.lv>0)d.insertAdjacentHTML('beforeend',`<div class="hb ${lastBuilt===i?'new':''}"><img src="${IMG['hi'+o.lv]}" alt=""><b>${'★'.repeat(o.lv)}</b></div>`);
      d.title=`${t.n} · chủ: ${ow?ow.name:''}`}
    else{pr.textContent=t.price;d.title=t.n}
  });
  lastBuilt=null;renderTokens();
}
function renderTokens(){
  document.querySelectorAll('.toks').forEach(x=>x.innerHTML='');
  S.players.forEach((p,k)=>{if(p.out||p.id===MOVING)return;const box=$('#t'+p.pos+' .toks');
    box.insertAdjacentHTML('beforeend',`<img src="${IMG['p'+p.id]}" alt="${esc(p.name)}" class="${k===S.cur?'me':''}">`)});
}
function cubeT(k,n){const[x,y]=DROT[n];return `rotateX(${SP[k][0]*360+x}deg) rotateY(${SP[k][1]*360+y}deg)`}
function cubeHTML(k){return `<div class="dwrap" id="dw${k}"><div class="cube" id="cb${k}" style="transform:${cubeT(k,S.dice[k])}"><div class="core"></div>${[1,2,3,4,5,6].map(n=>`<img class="f${n}" src="${IMG['d'+n]}" alt="">`).join('')}</div></div>`}
function dieHTML(n){const on={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[n];return [...Array(9)].map((_,k)=>`<i class="${on.includes(k)?'on':''}"></i>`).join('')}
function renderHUD(){
  const p=P();const ph=S.phase;
  let acts='';let note='';
  const manage=`<button class="btn blue" data-a="manage">Xây / bán nhà</button>`;
  if(S.over){note='Ván đã kết thúc.';acts=`<button class="btn main" data-a="replay">↻ Chơi lại</button><button class="btn" data-a="results">Xem kết quả</button><button class="btn" data-a="newgame">Chọn nhóm mới</button>`}
  else if(ph==='roll'){acts=`<button class="btn main" data-a="roll">Đổ xúc xắc</button>${manage}`}
  else if(ph==='again'){note='Đổ được đôi! Được đổ thêm một lần.';acts=`<button class="btn main" data-a="roll">Đổ tiếp</button>${manage}`}
  else if(ph==='end'){acts=`<button class="btn go" data-a="next">Kết thúc lượt</button>${manage}`}
  else if(ph==='jail'){note=`Đang ở tù (lượt thứ ${p.jt+1}/3). Chọn cách ra tù:`;
    acts=(S.set.jailQ?`<button class="btn main" data-a="jq">Trả lời câu hỏi</button>`:'')+
      `<button class="btn" data-a="bail" ${p.money<BAIL?'disabled':''}>Nộp ${BAIL} triệu</button>`+
      (p.free?`<button class="btn go" data-a="usefree">Dùng thẻ ra tù</button>`:'')+
      `<button class="btn" data-a="jroll">Đổ tìm đôi</button>`}
  else if(ph==='debt'){note=`Đang thiếu ${fmt(-p.money)}. Hãy bán nhà hoặc đất để trả nợ.`;
    acts=`<button class="btn blue" data-a="manage">Bán nhà / đất</button><button class="btn red" data-a="bankrupt">Tuyên bố phá sản</button>`}
  $('#hud').innerHTML=`
    <div class="turn"><img src="${IMG['p'+p.id]}" alt=""><div><div class="lbl">Lượt ${S.turn} · đến lượt</div><div class="pname">${esc(p.name)}</div></div>
      <div class="cash">${fmt(p.money)}<small>tiền mặt</small></div></div>
    <div class="dicebox" id="dicebox">${cubeHTML(0)}${cubeHTML(1)}<div class="dsum" id="dsum">${S.dice[0]+S.dice[1]}</div></div>
    ${note?`<div class="note">${note}</div>`:''}
    <div class="acts">${acts}</div>
    <ul class="log">${S.log.slice(0,4).map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`;
  if(lastCur!==S.cur&&!RM){const h=$('#hud');h.classList.remove('enter');void h.offsetWidth;h.classList.add('enter')}lastCur=S.cur;
  $('#hud').querySelectorAll('[data-a]').forEach(b=>{b.disabled=b.disabled||busy;b.onclick=()=>act(b.dataset.a)});
}
function renderPlayers(){
  $('#players').innerHTML=S.players.map((p,k)=>{
    const ps=props(p).sort((a,b)=>a-b);
    return `<div class="pc ${k===S.cur&&!S.over?'cur':''} ${p.out?'out':''}" id="pc${p.id}" style="--pc:${PCOL[p.id]}">
      <img class="tk" src="${IMG['p'+p.id]}" alt="">
      <div class="n">${esc(p.name)}</div><div class="m ${p.money<0?'neg':''}" data-pid="${p.id}">${fmt(p.money)}</div>
      <div class="bd">${p.out?'<span class="chip">Phá sản</span>':''}${p.inJail?'<span class="chip j">Đang ở tù</span>':''}${p.free?`<span class="chip f">Thẻ ra tù ×${p.free}</span>`:''}<span class="chip">Tài sản ${fmt(worth(p))}</span></div>
      <div class="props">${ps.map(i=>`<span class="${S.own[i].lv?'l':''}" style="--gc:${GC[TILES[i].g]}" title="${esc(TILES[i].n)}${S.own[i].lv?' · nhà cấp '+S.own[i].lv:''}"></span>`).join('')}</div>
    </div>`}).join('');
  S.players.forEach(p=>{const old=lastMoney[p.id];lastMoney[p.id]=p.money;if(old===undefined||old===p.money)return;
    const el=document.querySelector(`.m[data-pid="${p.id}"]`);if(!el)return;el.classList.add(p.money>old?'up':'down');
    if(RM)return;const t0=performance.now(),D=650;el.textContent=fmt(old);
    const tick=now=>{const f=Math.min(1,(now-t0)/D),e=1-Math.pow(1-f,3);if(!el.isConnected)return;el.textContent=fmt(Math.round(old+(p.money-old)*e));if(f<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)});
}
function render(){renderTiles();renderHUD();renderPlayers();save()}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#center').appendChild(t);setTimeout(()=>t.remove(),1900)}

function info(title,body,btn='Tiếp tục',cls='main',img){

/* ---------- money ---------- */
function pay(p,amt,to,why){p.money-=amt;if(to)to.money+=amt;log(`${p.name} ${why}: −${fmt(amt)}${to?' cho '+to.name:''}.`);sfx.pay();

/* ---------- motion helpers ---------- */
const cardEl=p=>$('#pc'+p.id);
function ctr(el){if(!el)return[innerWidth/2,innerHeight/2];const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
function fxEl(html){const d=document.createElement('div');d.className='fx';d.innerHTML=html;document.body.appendChild(d);return d}
function floatNum(x,y,text,color){if(RM)return;const d=fxEl(`<div class="fnum" style="color:${color}">${text}</div>`);
  d.animate([{transform:`translate(${x}px,${y}px) translate(-50%,-50%) scale(.4)`,opacity:0},{transform:`translate(${x}px,${y-30}px) translate(-50%,-50%) scale(1.15)`,opacity:1,offset:.25},
    {transform:`translate(${x}px,${y-80}px) translate(-50%,-50%) scale(1)`,opacity:0}],{duration:1400,easing:'ease-out'}).finished.then(()=>d.remove())}
function moneyFx(fromEl,toEl,amt,plus){
  const[x0,y0]=ctr(fromEl),[x1,y1]=ctr(toEl);
  floatNum(plus?x1:x0,(plus?y1:y0)-10,(plus?'+':'−')+fmt(amt),plus?'var(--good)':'var(--bad)');
  if(RM)return;const n=Math.min(8,2+Math.round(amt/60)),bill=amt>=100?IMG.m4:amt>=50?IMG.m3:IMG.m2;
  for(let k=0;k<n;k++){const d=fxEl(`<img class="bill" src="${bill}" alt="">`);const mx=(x0+x1)/2+(Math.random()-.5)*160,my=Math.min(y0,y1)-60-Math.random()*80,r=(Math.random()-.5)*60;
    d.animate([{transform:`translate(${x0}px,${y0}px) translate(-50%,-50%) scale(.5)`,opacity:0},{transform:`translate(${x0}px,${y0}px) translate(-50%,-50%) scale(.9)`,opacity:1,offset:.1},
      {transform:`translate(${mx}px,${my}px) translate(-50%,-50%) scale(1) rotate(${r}deg)`,offset:.5},{transform:`translate(${x1}px,${y1}px) translate(-50%,-50%) scale(.4) rotate(${r*2}deg)`,opacity:.2}],
      {duration:900,delay:k*70,easing:'cubic-bezier(.4,0,.3,1)',fill:'both'}).finished.then(()=>d.remove())}
}
function sparks(el,n=12,chars='★✦✧'){if(RM||!el)return;const[x,y]=ctr(el);
  for(let k=0;k<n;k++){const a=Math.PI*2*k/n+Math.random()*.4,dist=50+Math.random()*60,c=chars[k%chars.length];
    const d=fxEl(`<div class="spark" style="color:${['#ffb300','#ff5d8f','#3fa9f5','#35b86a'][k%4]}">${c}</div>`);
    d.animate([{transform:`translate(${x}px,${y}px) translate(-50%,-50%) scale(.3)`,opacity:1},{transform:`translate(${x+Math.cos(a)*dist}px,${y+Math.sin(a)*dist}px) translate(-50%,-50%) scale(1.2) rotate(180deg)`,opacity:0}],
      {duration:800+Math.random()*300,easing:'cubic-bezier(.2,.7,.3,1)'}).finished.then(()=>d.remove())}}
function ripple(i){const t=$('#t'+i);if(!t||RM)return;const r=document.createElement('div');r.className='ring';t.appendChild(r);setTimeout(()=>r.remove(),950)}
function tileAnim(i,cls){const t=$('#t'+i);if(!t||RM)return;t.classList.remove(cls);void t.offsetWidth;t.classList.add(cls);setTimeout(()=>t.classList.remove(cls),1200)}
let CF=null;
function confetti(x,y,n=90,rain=false){
  if(RM)return;if(!CF){const c=document.createElement('canvas');c.id='confetti';document.body.appendChild(c);CF={c,ctx:c.getContext('2d'),ps:[],run:false}}
  const{c}=CF;c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;
  const cols=['#ffb300','#ff5d8f','#3fa9f5','#35b86a','#8e5bd6','#e53935'];
  for(let k=0;k<n;k++){const a=rain?Math.PI/2:-Math.PI/2+(Math.random()-.5)*2.2,v=rain?2+Math.random()*3:7+Math.random()*9;
    CF.ps.push({x:rain?Math.random()*innerWidth:x,y:rain?-20-Math.random()*innerHeight*.6:y,vx:Math.cos(a)*v+(rain?(Math.random()-.5)*2:0),vy:Math.sin(a)*v,
      w:6+Math.random()*7,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[k%cols.length],life:rain?300:150})}
  if(!CF.run){CF.run=true;requestAnimationFrame(cfLoop)}
}
function cfLoop(){const{c,ctx}=CF,dp=devicePixelRatio;ctx.clearRect(0,0,c.width,c.height);
  CF.ps=CF.ps.filter(p=>p.life>0&&p.y<innerHeight+40);
  CF.ps.forEach(p=>{p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;ctx.save();ctx.translate(p.x*dp,p.y*dp);ctx.rotate(p.r);ctx.globalAlpha=Math.min(1,p.life/30);
    ctx.fillStyle=p.c;ctx.fillRect(-p.w*dp/2,-p.h*dp/2,p.w*dp,Math.max(1,p.h*dp*Math.abs(Math.cos(p.r*2))));ctx.restore()});
  if(CF.ps.length)requestAnimationFrame(cfLoop);else{CF.run=false;ctx.clearRect(0,0,c.width,c.height)}}
function jailFx(){if(RM)return Promise.resolve();const d=document.createElement('div');d.className='jailfx';d.innerHTML='<div class="bars"></div><b>VÀO TÙ!</b>';$('#center').appendChild(d);
  return sleep(1650).then(()=>d.remove())}

/* ---------- movement ---------- */
function tokenPt(i){const b=$('#board').getBoundingClientRect(),r=$('#t'+i).getBoundingClientRect();return[r.left-b.left+r.width/2,r.top-b.top+r.height*.97]}
function makeFlyer(p){const f=document.createElement('img');f.className='flyer';f.src=IMG['p'+p.id];f.alt='';const[x,y]=tokenPt(p.pos);f.style.left=x+'px';f.style.top=y+'px';
  $('#board').appendChild(f);MOVING=p.id;renderTokens();return f}
function hop(f,from,to,dur,lift){const[x0,y0]=tokenPt(from),[x1,y1]=tokenPt(to);
  return f.animate([{left:x0+'px',top:y0+'px',transform:'translate(-50%,-100%) scale(1,1)'},
    {left:(x0+x1)/2+'px',top:Math.min(y0,y1)-lift+'px',transform:'translate(-50%,-100%) scale(1.12,1.12)',offset:.5},
    {left:x1+'px',top:y1+'px',transform:'translate(-50%,-100%) scale(1.15,.82)',offset:.88},
    {left:x1+'px',top:y1+'px',transform:'translate(-50%,-100%) scale(1,1)'}],{duration:dur,easing:'ease-in-out',fill:'forwards'}).finished}
function dropFlyer(f){f.remove();MOVING=null;renderTokens()}
async function stepTo(p,steps){
  const dir=steps>0?1:-1;const f=RM?null:makeFlyer(p);const B=$('#board').clientWidth;
  for(let k=0;k<Math.abs(steps);k++){
    const from=p.pos;p.pos=(p.pos+dir+32)%32;
    if(f)await hop(f,from,p.pos,230,B*.05);else{renderTokens();await sleep(120)}
    sfx.step();
    if(dir>0&&p.pos===0){gain(p,GO_BONUS,'đi qua ô Bắt đầu');toast(`+${GO_BONUS} triệu · qua Bắt đầu`);tileAnim(0,'gold');sparks($('#t0'),14,'$★')}
  }
  if(f)dropFlyer(f);else renderTokens();
  ripple(p.pos);renderPlayers();
}
async function goTo(p,target){const n=(target-p.pos+32)%32;await stepTo(p,n||32)}
async function flyTo(p,target){
  if(RM){p.pos=target;renderTokens();return}
  const f=makeFlyer(p);const from=p.pos;p.pos=target;await hop(f,from,target,750,$('#board').clientWidth*.3);dropFlyer(f);ripple(target)}
async function sendJail(p,why){S.dc=0;log(`${p.name} vào tù${why?' ('+why+')':''}.`);sfx.bad();
  const fx=jailFx();if(p.pos!==JAIL)await flyTo(p,JAIL);p.pos=JAIL;p.inJail=true;p.jt=0;renderTokens();await fx}

/* ---------- dice ---------- */
async function rollDice(){
  const a=1+Math.random()*6|0,b=1+Math.random()*6|0;sfx.dice();
  [0,1].forEach(k=>{SP[k][0]+=2+(Math.random()*2|0);SP[k][1]+=2+(Math.random()*2|0)});
  S.dice=[a,b];
  [0,1].forEach(k=>{const c=$('#cb'+k),w=$('#dw'+k);if(!c)return;const d=1.05+k*.12;
    c.style.transition=RM?'none':`transform ${d}s cubic-bezier(.15,.7,.25,1)`;c.style.transform=cubeT(k,S.dice[k]);
    if(!RM){w.classList.remove('toss');void w.offsetWidth;w.style.animationDuration=d+'s';w.classList.add('toss')}});
  if(!RM){setTimeout(()=>tone(220,.06,'square',.08),620);setTimeout(()=>tone(200,.06,'square',.07),760)}
  await sleep(RM?100:1250);
  const s=$('#dsum');s.textContent=a+b;s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop');
  if(a===b){const d=document.createElement('div');d.className='dbl';d.textContent='ĐÔI!';$('#dicebox').appendChild(d);sparks($('#dicebox'),10)}
  await sleep(300);return[a,b];
}

/* ---------- turn flow ---------- */
async function act(a){
  if(busy)return;
  if(a==='manage')return manage();
  if(a==='results')return results();
  if(a==='newgame')return showSetup();
  if(a==='replay')return replay();
  if(a==='bankrupt')return bankrupt();
  busy=true;renderHUD();
  try{
    const p=P();
    if(a==='roll')await doRoll(p);
    else if(a==='next')nextTurn();
    else if(a==='bail'){pay(p,BAIL,null,'nộp tiền ra tù');p.inJail=false;S.phase='roll';toast('Đã ra tù');sparks($('#t'+JAIL))}
    else if(a==='usefree'){p.free--;p.inJail=false;S.phase='roll';log(`${p.name} dùng thẻ ra tù.`);toast('Đã ra tù')}
    else if(a==='jq'){const ok=await askQuestion('jail');
      if(ok){p.inJail=false;S.phase='roll';log(`${p.name} trả lời đúng và ra tù.`)}
      else{p.jt++;log(`${p.name} trả lời sai, ở lại tù.`);S.phase='end'}}
    else if(a==='jroll'){const[x,y]=await rollDice();
      if(x===y){p.inJail=false;log(`${p.name} đổ được đôi ${x}-${y}, ra tù.`);toast('Đổ được đôi! Ra tù');await stepTo(p,x+y);await resolve(p);finishMove(p,false)}
      else{p.jt++;log(`${p.name} đổ ${x}-${y}, chưa ra tù.`);S.phase='end'}}
  }finally{busy=false;checkDebt();render()}
}
async function doRoll(p){
  const[a,b]=await rollDice();const dbl=a===b;
  log(`${p.name} đổ được ${a} + ${b} = ${a+b}${dbl?' (đôi)':''}.`);
  if(dbl){S.dc++;if(S.dc>=3){await info('Ba lần đôi liên tiếp!','Đổ được đôi 3 lần liền, phải vào tù.','Vào tù','red',IMG.t_vaotu);await sendJail(p,'3 lần đôi');S.phase='end';return}}
  await stepTo(p,a+b);
  await resolve(p);
  finishMove(p,dbl);
}
function finishMove(p,dbl){S.phase=(!p.inJail&&!p.out&&dbl)?'again':'end'}
function checkDebt(){if(S&&!S.over){const p=P();if(!p.out&&p.money<0&&S.phase!=='debt'){S.after=S.phase;S.phase='debt'}else if(S.phase==='debt'&&p.money>=0){S.phase=S.after||'end';toast('Đã trả hết nợ')}}}

async function resolve(p){
  const i=p.pos,t=TILES[i];flash(i);
  if(t.t==='prop'){
    const o=S.own[i];
    if(!o){
      if(p.money>=t.price){
        const v=await modal(`<div class="tinfo"><img src="${IMG[t.img]}" alt=""><div><h3>${esc(t.n)}</h3>
          <p>Mảnh đất này chưa có chủ. Giá <b>${fmt(t.price)}</b>. Tiền thuê đất trống: <b>${t.price/10} triệu</b>.</p>
          <p style="font-size:1rem;color:var(--ink-soft)">Bạn đang có ${fmt(p.money)}.</p></div></div>
          <div class="mbtns"><button class="btn main" data-v="buy">Mua đất</button><button class="btn" data-v="skip">Bỏ qua</button></div>`);
        if(v==='buy'){p.money-=t.price;S.own[i]={p:p.id,lv:0};log(`${p.name} mua ${t.n} giá ${fmt(t.price)}.`);sfx.coin();toast(`Đã mua ${t.n}`);
          moneyFx(cardEl(p),$('#t'+i),t.price,false);renderTiles();tileAnim(i,'stamp');sparks($('#t'+i));
          if(fullSet(p.id,t.g))toast('Đủ bộ màu! Tiền thuê đất trống ×2')}
      }else await info(esc(t.n),`Giá ${fmt(t.price)} nhưng bạn chỉ có ${fmt(p.money)}. Chưa mua được.`);
    }else if(o.p!==p.id){
      const ow=byId(o.p),r=rentOf(i);
      await info(`Trả tiền thuê ${fmt(r)}`,`${esc(t.n)} thuộc về <b>${esc(ow.name)}</b>${o.lv?` (nhà cấp ${o.lv})`:''}.`,'Trả tiền','red',IMG['p'+ow.id]);
      pay(p,r,ow,`trả thuê ${t.n}`);
      await offerBuyout(p,i);
    }else if(o.lv<5&&canBuild(p,i)){const nl=o.lv+1;
      const v=await modal(`<div class="tinfo"><img src="${IMG['h'+nl]}" alt=""><div><h3>${esc(t.n)}</h3>
        <p>Đây là đất của bạn${o.lv?` (đang có nhà cấp ${o.lv})`:''}. Xây <b>nhà cấp ${nl}</b> với giá <b>${fmt(HOUSE[nl])}</b>?</p>
        <p style="font-size:1rem;color:var(--ink-soft)">Tiền thuê sẽ tăng từ ${rentOf(i)} lên <b>${t.price/10*MULT[nl]} triệu</b>. Bạn đang có ${fmt(p.money)}.</p></div></div>
        <div class="mbtns"><button class="btn go" data-v="build">Xây nhà cấp ${nl}</button><button class="btn" data-v="skip">Để sau</button></div>`);
      if(v==='build')buildHouse(p,i);
    }else toast(o.lv>=5?'Đất của bạn · nhà cấp 5 tối đa':'Đất của bạn');
  }
  else if(t.t==='ch'||t.t==='vk')await chance(p,t.t);
  else if(t.t==='tax'){await info('Nộp thuế',`Nộp ${TAX} triệu tiền thuế cho ngân hàng.`,'Nộp thuế','red',IMG.t_thue);pay(p,TAX,null,'nộp thuế')}
  else if(t.t==='jail'){await info('Vào tù!','Bạn dừng ở ô Vào tù.','Vào tù','red',IMG.t_vaotu);await sendJail(p)}
  else if(t.t==='rest'){toast('Đi nghỉ · thư giãn một lượt');log(`${p.name} đi nghỉ.`)}
  else if(t.t==='go'){toast('Đứng ở ô Bắt đầu')}
  renderPlayers();renderTiles();
}

function houseValue(i){let v=TILES[i].price;for(let k=1;k<=S.own[i].lv;k++)v+=HOUSE[k];return v}
const buyMult=()=>S.set.buyMult===undefined?1.5:S.set.buyMult;
function buyPrice(i){return Math.round(houseValue(i)*buyMult())}
async function offerBuyout(p,i){
  const o=S.own[i];if(!buyMult()||!o||o.p===p.id||p.out)return;
  const t=TILES[i],ow=byId(o.p),bp=buyPrice(i);
  if(o.lv>=5){toast('Nhà cấp 5 không thể bị mua lại');return}
  if(p.money<bp){if(p.money>=0)toast(`Cần ${fmt(bp)} để mua lại ${t.n}`);return}
  await sleep(500);
  const v=await modal(`<h3>Mua lại ${esc(t.n)}?</h3>
    <div class="buyout"><img src="${IMG['p'+ow.id]}" alt="${esc(ow.name)}"><div class="arr">➜</div><img src="${o.lv?IMG['hi'+o.lv]:IMG[t.img]}" alt="" style="border-radius:12px"><div class="arr">➜</div><img src="${IMG['p'+p.id]}" alt="${esc(p.name)}"></div>
    <p>Đất ${o.lv?`và nhà cấp ${o.lv} `:''}của <b>${esc(ow.name)}</b> đang có giá trị ${fmt(houseValue(i))}. Mua lại với giá <b>${fmt(bp)}</b> (×${String(buyMult()).replace('.',',')}), toàn bộ tiền trả cho ${esc(ow.name)}.</p>
    <p style="font-size:1rem;color:var(--ink-soft)">Bạn đang có ${fmt(p.money)}. Nhà giữ nguyên cấp sau khi đổi chủ.</p>
    <div class="mbtns"><button class="btn main" data-v="buy">Mua lại ${fmt(bp)}</button><button class="btn" data-v="no">Không mua</button></div>`);
  if(v!=='buy')return;
  p.money-=bp;ow.money+=bp;o.p=p.id;log(`${p.name} mua lại ${t.n} từ ${ow.name} giá ${fmt(bp)}.`);
  sfx.good();moneyFx(cardEl(p),cardEl(ow),bp,false);renderTiles();renderPlayers();tileAnim(i,'stamp');sparks($('#t'+i),16);
  toast(`Đã mua lại ${t.n}`);if(fullSet(p.id,t.g))setTimeout(()=>toast('Đủ bộ màu! Tiền thuê đất trống ×2'),1300);
}
/* ---------- questions ---------- */
function nextQ(){if(S.qPtr>=S.qOrder.length){S.qOrder=shuffle([...Q.keys()]);S.qPtr=0}return S.qOrder[S.qPtr++]}
function askQuestion(kind){
  const qi=nextQ(),[lv,text,opts,ans]=Q[qi];
  const img=kind==='vk'?IMG.card0:kind==='ch'?IMG.card1:IMG.t_vaotu;
  const label=kind==='vk'?'Ô Vận khí':kind==='ch'?'Ô Cơ hội':'Ra tù';
  const rule=kind==='jail'?'Trả lời đúng để ra tù ngay. Sai thì ở lại tù.':'Trả lời đúng để mở thẻ. Trả lời sai sẽ phải vào tù.';
  const T=S.set.qTime;
  return new Promise(res=>{
    let done=false,timer=null;
    modal(`<div class="qhead"><img src="${img}" alt=""><div><div class="qmeta"><span class="chip">${label}</span><span class="chip">${lv}</span><span class="chip">Câu ${qi+1}/30</span></div>
      <div style="font-weight:800;color:var(--ink-soft)">${esc(P().name)} · ${rule}</div>${T?`<div class="timer"><i id="tbar"></i></div>`:''}</div></div>
      <div class="qtext">${esc(text)}</div>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}"><b>${LETTERS[k]}</b><span>${esc(o.replace(/^[A-D]\.\s*/,''))}</span></button>`).join('')}</div>
      <div id="qres"></div>`,{wide:true,onMount(md){
        const finish=k=>{if(done)return;done=true;clearInterval(timer);const ok=k===ans;
          md.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const kk=+b.dataset.k;if(kk===ans)b.classList.add('ok');else if(kk===k)b.classList.add('no')});
          ok?sfx.good():sfx.bad();ok?S.stats.right++:S.stats.wrong++;
          if(ok){const[cx,cy]=ctr(md);confetti(cx,cy-60,110)}else if(!RM){md.classList.remove('shake');void md.offsetWidth;md.classList.add('shake')}
          const nxt=kind==='jail'?(ok?'Ra tù':'Ở lại tù'):(ok?'Mở thẻ':'Vào tù');
          md.querySelector('#qres').innerHTML=`<div class="verdict ${ok?'ok':'no'}">${ok?'Chính xác!':(k<0?'Hết giờ!':'Chưa đúng!')} ${ok?'':`Đáp án đúng là ${LETTERS[ans]}.`}</div>
            <div class="mbtns"><button class="btn ${ok?'main':'red'}" id="qgo">${nxt}</button></div>`;
          const g=md.querySelector('#qgo');g.focus();g.onclick=()=>{closeModal();res(ok)}};
        md.querySelectorAll('.opt').forEach(b=>b.onclick=()=>finish(+b.dataset.k));
        if(T){const t0=Date.now(),bar=md.querySelector('#tbar');timer=setInterval(()=>{const f=1-(Date.now()-t0)/(T*1000);
          bar.style.transform=`scaleX(${Math.max(0,f)})`;if(f<=0)finish(-1)},100)}
      }});
  });
}
async function chance(p,kind){
  const ok=await askQuestion(kind);
  if(!ok){log(`${p.name} trả lời sai ở ô ${kind==='ch'?'Cơ hội':'Vận khí'} và vào tù.`);await sendJail(p,'trả lời sai');return}
  log(`${p.name} trả lời đúng, được bốc thẻ.`);
  if(S.dp[kind]>=S.deck[kind].length){S.deck[kind]=shuffle([...DECK[kind].keys()]);S.dp[kind]=0}
  const c=DECK[kind][S.deck[kind][S.dp[kind]++]];
  const col=kind==='ch'?'#e2468a':'#f29a00',bg=kind==='ch'?'#fff0f6':'#fff8dc';
  await modal(`<h3 style="text-align:center">${kind==='ch'?'Thẻ Cơ hội':'Thẻ Vận khí'}</h3>
    <div class="flip" id="flip"><div class="in"><div class="fa"><img src="${IMG[kind==='ch'?'card1':'card0']}" alt=""></div>
    <div class="fa bk" style="--cc:${col};--cbg:${bg}"><small>${kind==='ch'?'Cơ hội':'Vận khí'}</small>${esc(c.t)}</div></div></div>
    <div class="mbtns"><button class="btn main" data-v="ok" id="cgo" disabled>Thực hiện</button></div>`,
    {onMount(md){setTimeout(()=>{md.querySelector('#flip')?.classList.add('open');sfx.build()},350);setTimeout(()=>{const b=md.querySelector('#cgo');if(b){b.disabled=false;b.focus()}},1150)}});
  log(`Thẻ: ${c.t}`);
  await applyCard(p,c);
}
async function applyCard(p,c){
  const others=alive().filter(o=>o!==p);
  switch(c.a){
    case'money':c.v>0?gain(p,c.v,'nhận thưởng'):pay(p,-c.v,null,'bị trừ tiền');break;
    case'goto':await goTo(p,c.to);await resolve(p);break;
    case'move':await stepTo(p,c.n);await resolve(p);break;
    case'free':p.free++;toast('Nhận thẻ ra tù');break;
    case'repair':{const n=levels(p);if(n)pay(p,n*c.v,null,`sửa ${n} cấp nhà`);else toast('Chưa có nhà nên không mất tiền');break}
    case'each':others.forEach(o=>{if(c.v>0){o.money-=c.v;p.money+=c.v}else{p.money+=c.v;o.money-=c.v}});
      log(c.v>0?`${p.name} nhận ${c.v} triệu từ mỗi người.`:`${p.name} trả mỗi người ${-c.v} triệu.`);c.v>0?sfx.coin():sfx.pay();break;
    case'jail':await sendJail(p,'thẻ Vận khí');break;
  }
}

function nextTurn(){
  if(S.over)return;
  let n=S.cur;do{n=(n+1)%S.players.length}while(S.players[n].out);
  if(n<=S.cur)S.turn++;
  S.cur=n;S.dc=0;const p=P();
  if(p.inJail){
    if(p.jt>=3){p.money-=BAIL;p.inJail=false;log(`${p.name} đã ở tù 3 lượt, tự nộp ${BAIL} triệu để ra.`);toast(`Hết 3 lượt ở tù · nộp ${BAIL} triệu`);S.phase='roll'}
    else S.phase='jail';
  }else S.phase='roll';
}

/* ---------- build / sell ---------- */
function canBuild(p,i){const o=S.own[i];return o&&o.p===p.id&&o.lv<5&&(!S.set.setRule||fullSet(p.id,TILES[i].g))&&p.money>=HOUSE[o.lv+1]&&S.phase!=='debt'}
function buildHouse(p,i){const o=S.own[i];if(!canBuild(p,i))return;o.lv++;p.money-=HOUSE[o.lv];log(`${p.name} xây nhà cấp ${o.lv} ở ${TILES[i].n}.`);sfx.build();lastBuilt=i;
  checkDebt();render();tileAnim(i,'stamp');sparks($('#t'+i),12,'★');floatNum(...ctr($('#t'+i)),'Nhà cấp '+o.lv,'var(--gold-dk)')}
function manage(){
  const p=P();
  const draw=md=>{
    const ps=props(p).sort((a,b)=>a-b);
    md.querySelector('#mlist').innerHTML=ps.length?ps.map(i=>{const t=TILES[i],o=S.own[i];
      const why=o.lv>=5?'Đã đạt cấp tối đa':S.set.setRule&&!fullSet(p.id,t.g)?'Cần đủ bộ màu':S.phase==='debt'?'Đang nợ':p.money<HOUSE[o.lv+1]?'Không đủ tiền':'';
      return `<div class="mrow" style="--gc:${GC[t.g]}"><div class="dot"></div>
        <div class="t">${esc(t.n)} ${o.lv?'<span style="color:var(--gold-dk)">'+'★'.repeat(o.lv)+'</span>':''}<small>${o.lv?'Nhà cấp '+o.lv:'Đất trống'} · thuê ${rentOf(i)} triệu${why?' · '+why:''}</small></div>
        <div class="b">${o.lv<5?`<button class="btn go" data-b="${i}" ${canBuild(p,i)?'':'disabled'}>Xây cấp ${o.lv+1} (−${HOUSE[o.lv+1]})</button>`:''}
        ${o.lv>0?`<button class="btn" data-s="${i}">Bán nhà (+${HOUSE[o.lv]/2})</button>`:`<button class="btn red" data-l="${i}">Bán đất (+${t.price/2})</button>`}</div></div>`}).join('')
      :'<p>Chưa sở hữu mảnh đất nào.</p>';
    md.querySelector('#mcash').textContent=fmt(p.money);
    md.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{buildHouse(p,+b.dataset.b);draw(md)});
    md.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const i=+b.dataset.s,o=S.own[i];p.money+=HOUSE[o.lv]/2;log(`${p.name} bán nhà cấp ${o.lv} ở ${TILES[i].n}.`);o.lv--;sfx.coin();after()});
    md.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const i=+b.dataset.l;const t=TILES[i];
      if(S.set.setRule&&groupTiles(t.g).some(j=>S.own[j]&&S.own[j].p===p.id&&S.own[j].lv>0)){toast('Bán hết nhà trong bộ màu trước');return}
      p.money+=t.price/2;delete S.own[i];log(`${p.name} bán ${t.n} cho ngân hàng.`);sfx.coin();after()});
    function after(){checkDebt();render();draw(md)}
  };
  modal(`<h3>Xây / bán nhà · ${esc(p.name)}</h3><p style="margin-top:0">Tiền mặt: <b id="mcash"></b>. Bán nhà được nửa giá xây, bán đất được nửa giá mua.</p>
    <div class="mg" id="mlist"></div><div class="mbtns"><button class="btn main" data-v="ok">Xong</button></div>`,{wide:true,onMount:draw});
}
function tileInfo(i){
  const t=TILES[i];
  if(!t.price){const d={go:`Mỗi lần đi qua hoặc dừng ở ô này được nhận ${GO_BONUS} triệu.`,jail:'Dừng ở ô này là vào tù. Ra tù bằng cách trả lời đúng câu hỏi, nộp 50 triệu, dùng thẻ ra tù hoặc đổ được đôi. Sau 3 lượt sẽ tự nộp 50 triệu để ra.',
    rest:'Ô nghỉ ngơi, không mất gì.',tax:`Dừng ở đây phải nộp ${TAX} triệu.`,ch:'Trả lời đúng 1 câu hỏi mới được bốc thẻ Cơ hội. Trả lời sai phải vào tù.',vk:'Trả lời đúng 1 câu hỏi mới được bốc thẻ Vận khí. Trả lời sai phải vào tù.'}[t.t];
    const img=t.t==='ch'?IMG.card1:t.t==='vk'?IMG.card0:IMG[t.img];
    return info(esc(t.n),d,'Đóng','',img)}
  const o=S.own[i],b=t.price/10,ow=o&&byId(o.p);
  const rows=[['Đất trống',b,o&&o.lv===0&&!fullSet(o.p,t.g)],['Đủ bộ màu, chưa có nhà',b*2,o&&o.lv===0&&fullSet(o.p,t.g)],...[1,2,3,4,5].map(l=>[`Nhà cấp ${l} (xây ${HOUSE[l]} triệu)`,b*MULT[l],o&&o.lv===l])];
  const set=groupTiles(t.g).map(j=>TILES[j].n).join(', ');
  return modal(`<div class="tinfo"><img src="${IMG[t.img]}" alt=""><div><h3 style="border-bottom:6px solid ${GC[t.g]};padding-bottom:4px">${esc(t.n)}</h3>
    <p style="font-size:1rem;margin:.2em 0">Giá đất <b>${fmt(t.price)}</b> · Chủ: <b>${ow?esc(ow.name):'chưa có'}</b></p>
    <p style="font-size:.95rem;color:var(--ink-soft);margin:.2em 0 .6em">Cùng bộ màu: ${esc(set)}${o&&buyMult()?(o.lv>=5?' · Nhà cấp 5, không thể mua lại':` · Giá mua lại: <b>${fmt(buyPrice(i))}</b>`):''}</p>
    <table class="rt">${rows.map(r=>`<tr class="${r[2]?'now':''}"><td>${r[0]}</td><td>${r[1]} triệu</td></tr>`).join('')}</table></div></div>
    <div class="mbtns"><button class="btn main" data-v="ok">Đóng</button></div>`);
}

/* ---------- bankruptcy / end ---------- */
async function bankrupt(){
  const p=P();
  const v=await modal(`<h3>${esc(p.name)} tuyên bố phá sản?</h3><p>Toàn bộ đất và nhà sẽ trả lại ngân hàng, nhóm này dừng chơi.</p>
    <div class="mbtns"><button class="btn red" data-v="yes">Phá sản</button><button class="btn" data-v="no">Quay lại</button></div>`);
  if(v!=='yes')return;
  props(p).forEach(i=>delete S.own[i]);p.out=true;p.money=0;p.inJail=false;log(`${p.name} phá sản.`);sfx.bad();
  if(alive().length<=1){S.over=true;render();return results()}
  S.phase='end';nextTurn();render();
}
function results(){
  const r=S.players.slice().sort((a,b)=>(a.out-b.out)||worth(b)-worth(a));
  const tot=S.stats.right+S.stats.wrong;
  setTimeout(()=>{confetti(0,0,220,true);sfx.good()},250);
  return modal(`<h3>Kết quả ván chơi</h3>
    <p style="margin-top:0;font-size:1rem">Các nhóm đã trả lời ${tot} câu hỏi, đúng ${S.stats.right} câu${tot?` (${Math.round(S.stats.right/tot*100)}%)`:''}.</p>
    <div class="rank">${r.map((p,k)=>`<div class="rk"><div class="no">${k+1}</div><img src="${IMG['p'+p.id]}" alt=""><div class="nn">${esc(p.name)}<small>${p.out?'Phá sản':`Tiền mặt ${fmt(p.money)} · ${props(p).length} mảnh đất · ${levels(p)} cấp nhà`}</small></div><div class="w">${p.out?'—':fmt(worth(p))}</div></div>`).join('')}</div>
    <div class="mbtns"><button class="btn main" data-v="again">↻ Chơi lại (giữ các nhóm)</button><button class="btn go" data-v="new">Chọn nhóm mới</button><button class="btn" data-v="ok">Xem lại bàn cờ</button></div>`,{wide:true})
    .then(v=>{if(v==='again')replay();else if(v==='new')showSetup()});
}
async function endGame(){
  const v=await modal(`<h3>Kết thúc ván và tính điểm?</h3><p>Nhóm có tổng tài sản lớn nhất (tiền mặt + giá đất + tiền xây nhà) sẽ thắng.</p>
    <div class="mbtns"><button class="btn red" data-v="yes">Kết thúc ván</button><button class="btn" data-v="no">Chơi tiếp</button></div>`);
  if(v==='yes'){S.over=true;render();results()}
}

function replay(){
  const ps=S.players.map(p=>({id:p.id,name:p.name}));const set=S.set;
  newGame(ps,set);render();toast('Ván mới đã bắt đầu');
}
async function askRestart(){
  if(busy)return;
  const v=await modal(`<h3>Chơi lại từ đầu?</h3><p>Ván hiện tại sẽ bị xoá. Mọi nhóm quay về ô Bắt đầu với số vốn ban đầu, đất và nhà trả lại ngân hàng.</p>
    <div class="mbtns"><button class="btn main" data-v="same">↻ Chơi lại với các nhóm cũ</button><button class="btn go" data-v="new">Chọn nhóm mới</button><button class="btn" data-v="no">Huỷ</button></div>`);
  if(v==='same')replay();else if(v==='new')showSetup();
}
/* ---------- rules ---------- */
function rules(){
  return modal(`<h3>Luật chơi</h3><ol class="rules">
   <li>Mỗi nhóm bắt đầu ở ô <b>Bắt đầu</b> với số vốn đã chọn. Lần lượt đổ 2 xúc xắc và đi theo chiều kim đồng hồ.</li>
   <li>Đi qua hoặc dừng ở ô Bắt đầu được nhận <b>${GO_BONUS} triệu</b>.</li>
   <li>Dừng ở đất chưa có chủ thì được <b>mua</b>. Dừng ở đất của nhóm khác thì phải <b>trả tiền thuê</b>.</li>
   <li>Đất đã mua thì được <b>xây nhà</b> từ cấp 1 đến cấp 5 (10, 20, 50, 100, 200 triệu): bấm <b>Xây / bán nhà</b> bất cứ lúc nào trong lượt của mình, hoặc xây ngay khi dừng lại ở đất của mình. Nhà càng cao, tiền thuê càng lớn. Sở hữu <b>đủ bộ màu</b> thì tiền thuê đất trống tăng gấp đôi.${S&&S.set.setRule?' <i>(Ván này bật luật: phải đủ bộ màu mới được xây nhà.)</i>':''}</li>
   <li><b>Mua lại nhà người khác</b>: sau khi trả tiền thuê, có thể mua lại đất đó (kể cả nhà trên đất) với giá ${buyMult()?'×'+String(buyMult()).replace('.',',')+' giá trị':'(đang tắt)'}. Tiền trả cho chủ cũ, chủ cũ không được từ chối. <b>Nhà cấp 5</b> không thể bị mua lại.</li>
   <li>Dừng ở ô <b>Cơ hội</b> hoặc <b>Vận khí</b>: phải <b>trả lời đúng 1 câu hỏi</b> mới được bốc thẻ. Trả lời sai thì <b>vào tù</b>.</li>
   <li>Đổ được đôi thì được đổ thêm. Đổ đôi 3 lần liên tiếp thì vào tù. Dừng ở ô <b>Vào tù</b> cũng vào tù.</li>
   <li>Ra tù bằng cách: trả lời đúng câu hỏi, nộp ${BAIL} triệu, dùng thẻ ra tù, hoặc đổ được đôi. Ở tù đủ 3 lượt thì tự nộp ${BAIL} triệu để ra.</li>
   <li>Dừng ở ô <b>Nộp thuế</b> phải nộp ${TAX} triệu. Ô <b>Đi nghỉ</b> không mất gì.</li>
   <li>Thiếu tiền thì bán nhà (nửa giá xây) hoặc bán đất (nửa giá mua). Không đủ trả thì <b>phá sản</b>.</li>
   <li>Ván kết thúc khi chỉ còn 1 nhóm, hoặc khi giáo viên bấm <b>Kết thúc ván</b>: nhóm có tổng tài sản lớn nhất thắng. Bấm <b>↻ Chơi lại</b> để bắt đầu ván mới bất cứ lúc nào.</li>
  </ol><div class="mbtns"><button class="btn main" data-v="ok">Đã hiểu</button></div>`,{wide:true});
}

/* ---------- setup ---------- */
function showSetup(){
  const saved=loadSaved();
  const el=$('#setup');el.hidden=false;el.style.backgroundImage=`url(${IMG.board})`;
  let on=[true,true,true,true,false,false];
  el.innerHTML=`<div class="sbox">
    <h2>Cờ Tỷ Phú <span>AI</span></h2>
    <div class="sub">Trí tuệ nhân tạo THCS · Tuần 12 · Dữ liệu tốt, kết quả đáng tin hơn · 30 câu hỏi ôn tập</div>
    <div class="picks">${PDEF.map((n,k)=>`<div class="pk ${on[k]?'on':''}" style="--pc:${PCOL[k]}" id="pk${k}">
      <button type="button" data-k="${k}" aria-label="Chọn ${n}"><img src="${IMG['p'+k]}" alt=""></button>
      <input id="pn${k}" value="${n}" maxlength="18" aria-label="Tên nhóm ${k+1}"></div>`).join('')}</div>
    <div class="opts2">
      <label>Vốn ban đầu<select id="sStart"><option value="1000">1 tỷ</option><option value="1500" selected>1,5 tỷ</option><option value="2000">2 tỷ</option></select></label>
      <label>Thời gian trả lời<select id="sTime"><option value="0">Không giới hạn</option><option value="20">20 giây</option><option value="30" selected>30 giây</option><option value="45">45 giây</option><option value="60">60 giây</option></select></label>
      <label>Mua lại nhà người khác<select id="sBuy"><option value="0">Không cho mua lại</option><option value="1.5" selected>Giá ×1,5</option><option value="2">Giá ×2</option></select></label>
      <label class="ck"><input type="checkbox" id="sSet">Bắt buộc đủ bộ màu mới được xây nhà (khó)</label>
      <label class="ck"><input type="checkbox" id="sJq" checked>Cho trả lời câu hỏi để ra tù</label>
    </div>
    <div class="sact">
      <button class="btn main" id="sGo">Bắt đầu chơi</button>
      ${saved?`<button class="btn go" id="sResume">Chơi tiếp ván đang dở</button>`:''}
      <button class="btn" id="sRules">Luật chơi</button>
    </div></div>`;
  el.querySelectorAll('.pk button').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;on[k]=!on[k];$('#pk'+k).classList.toggle('on',on[k])});
  $('#sRules').onclick=rules;
  $('#sGo').onclick=()=>{
    const ps=on.map((v,k)=>v?{id:k,name:($('#pn'+k).value.trim()||PDEF[k])}:null).filter(Boolean);
    if(ps.length<2){info('Cần ít nhất 2 nhóm','Bấm vào hình nhân vật để chọn nhóm tham gia.');return}
    newGame(ps,{start:+$('#sStart').value,qTime:+$('#sTime').value,setRule:$('#sSet').checked,jailQ:$('#sJq').checked,buyMult:+$('#sBuy').value});
    el.hidden=true;render();
  };
  if(saved)$('#sResume').onclick=()=>{S=saved;if(!['roll','again','end','jail','debt'].includes(S.phase))S.phase='end';el.hidden=true;render()};
}

/* ---------- boot ---------- */
function start(data){
  buildBoard();
  $('#bRules').onclick=rules;
  $('#bSound').onclick=()=>{soundOn=!soundOn;$('#bSound').style.opacity=soundOn?1:.45;if(soundOn)sfx.coin()};
  $('#bFull').onclick=()=>{const d=document.documentElement;try{document.fullscreenElement?document.exitFullscreen():d.requestFullscreen&&d.requestFullscreen().catch(()=>{})}catch(e){}};
  $('#bRestart').onclick=()=>{if(S&&$('#setup').hidden)askRestart()};
  $('#bEnd').onclick=()=>{if(S&&!busy){S.over?results():endGame()}};
  if(data&&data.S){S=data.S;if(!['roll','again','end','jail','debt'].includes(S.phase))S.phase='end';render()}
  else{
    // demo state behind the setup screen so the board never looks empty
    newGame([{id:0,name:PDEF[0]},{id:1,name:PDEF[1]},{id:2,name:PDEF[2]},{id:3,name:PDEF[3]}],{start:1500,qTime:30,setRule:false,jailQ:true,buyMult:1.5});
    renderTiles();renderHUD();renderPlayers();showSetup();
  }
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
